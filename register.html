<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Explore</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="page-register">
    <header class="header">
        <a href="index.html" class="logo">ФинКод Нижнего</a>
        <nav class="nav">
            <a href="index.html#auth" class="nav-link">Войти</a>
        </nav>
    </header>

    <main class="register-main">
        <div class="register-card">
            <h1 class="register-title">Создайте аккаунт</h1>
            <p class="register-subtitle">Присоединяйтесь, чтобы пройти невероятную экскурсию по ключевым финансовым местам Нижнего Новгорода!</p>

            <form id="registrationForm" class="auth-form register-form">
                <label class="label" for="username">Имя</label>
                <input type="text" id="username" class="input" placeholder="Ваше имя" required autocomplete="username">
                <label class="label" for="email">Email</label>
                <input type="email" id="email" class="input" placeholder="you@example.com" required autocomplete="email">
                <label class="label" for="password">Пароль</label>
                <input type="password" id="password" class="input" placeholder="Минимум 6 символов" required autocomplete="new-password">
                <p id="registrationError" class="form-error" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
            </form>

            <p class="register-footer">
                Уже есть аккаунт? <a href="index.html#auth">Войти</a>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
