<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрут</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-profile">
    <header class="header">
        <div id="userInfo" class="profile-user-info">
            <span id="userName"></span>
            <span id="userEmail"></span>
            <button id="switchRouteBtn" class="btn btn-ghost btn-sm" type="button">Сменить маршрут</button>
            <a href="index.html#logout" class="nav-link">Выйти</a>
        </div>
    </header>

    <section id="routePicker" class="route-picker">
        <h2 class="route-picker-title">Выберите маршрут</h2>
        <p class="route-picker-subtitle">Сначала выберите маршрут, после этого откроются здания этого маршрута.</p>
        <div id="routesContainer" class="routes-grid"></div>
        <p id="routeError" class="form-error" aria-live="polite"></p>
    </section>

    <section id="routeSummary" class="route-summary" hidden>
        <span>Текущий маршрут:</span>
        <strong id="currentRouteName"></strong>
    </section>

    <!-- Список зданий -->
    <div id="buildingsContainer">
        <!-- Здания будут динамически добавляться сюда -->
    </div>

    <script src="script.js"></script>
</body>
</html>
